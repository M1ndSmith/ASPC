# ASPC production stack — Redpanda, Mosquitto, TimescaleDB, Redis, API, stream engine, frontend.
# Usage:
#   cp deploy/compose/.env.example deploy/compose/.env   # then edit secrets
#   docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env up -d

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr
      - INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
    # Bind to loopback only — infra must not be reachable from the LAN.
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aspc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/compose/.env}
      POSTGRES_DB: ${POSTGRES_DB:-aspc}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aspc} -d $${POSTGRES_DB:-aspc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    env_file:
      - .env
    environment:
      ASPC_PERSISTENCE_BACKEND: timescale
      ASPC_TIMESCALE_DSN: postgresql+psycopg://${POSTGRES_USER:-aspc}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-aspc}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPC_PERSISTENCE_BACKEND: timescale
      ASPC_TIMESCALE_DSN: postgresql+asyncpg://${POSTGRES_USER:-aspc}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-aspc}
      ASPC_REDIS_URL: redis://redis:6379/0
      ASPC_KAFKA_BOOTSTRAP: redpanda:9092
      ASPC_CORS_ORIGINS: ${ASPC_CORS_ORIGINS:-http://localhost:3000}
      ASPC_JWT_SECRET: ${ASPC_JWT_SECRET:?Set ASPC_JWT_SECRET in deploy/compose/.env}
      ASPC_API_KEYS: ${ASPC_API_KEYS:?Set ASPC_API_KEYS in deploy/compose/.env}
      ASPC_ADMIN_USERNAME: ${ASPC_ADMIN_USERNAME:-admin}
      ASPC_ADMIN_PASSWORD: ${ASPC_ADMIN_PASSWORD:?Set ASPC_ADMIN_PASSWORD in deploy/compose/.env}
      ASPC_AUTH_ENABLED: ${ASPC_AUTH_ENABLED:-true}
      # Disable create_all race — migrations ran in migrate service
      ASPC_TSDB_INIT: "0"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  stream-engine:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.stream_engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPC_TIMESCALE_DSN: postgresql+asyncpg://${POSTGRES_USER:-aspc}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-aspc}
      ASPC_REDIS_URL: redis://redis:6379/0
      ASPC_KAFKA_BOOTSTRAP: redpanda:9092
      ASPC_KAFKA_TOPIC: spc.measurements
      ASPC_TSDB_INIT: "0"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  mqtt-bridge:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mqtt_bridge
    restart: unless-stopped
    environment:
      ASPC_MQTT_HOST: mosquitto
      ASPC_MQTT_PORT: "1883"
      ASPC_MQTT_TOPIC: sensors/#
      ASPC_KAFKA_BOOTSTRAP: redpanda:9092
      ASPC_KAFKA_TOPIC: spc.measurements
    depends_on:
      mosquitto:
        condition: service_started
      redpanda:
        condition: service_healthy

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
      # NEXT_PUBLIC_* are baked at build time — runtime env does not update the bundle.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["ops"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - timescaledb

volumes:
  tsdata:
